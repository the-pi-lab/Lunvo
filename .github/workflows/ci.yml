name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests (vitest)
        run: npm run test

      - name: Guard — no build_log.txt
        run: |
          if [ -f build_log.txt ]; then
            echo "::error::build_log.txt must be deleted (Phase 35)"
            ls -l build_log.txt
            exit 1
          fi
          if [ -f prod-build.log ]; then
            echo "::warning::prod-build.log should be deleted or gitignored"
          fi
          echo "No build_log.txt — OK"
